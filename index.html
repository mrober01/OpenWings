<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>OpenWings — free browser flight & air-combat sim</title>
<meta name="description" content="Free 3D flight and air-combat sim in your browser, phone or PC. 9 aircraft, 7 missions, carrier landings, autopilot, real New York, Paris, London and Rio. One HTML file, works offline.">
<meta property="og:type" content="website">
<meta property="og:title" content="OpenWings — free browser flight & air-combat sim">
<meta property="og:description" content="9 aircraft, 7 missions, carrier landings, autopilot, real New York, Paris, London and Rio. Runs on your phone, nothing to install.">
<meta property="og:url" content="https://mrober01.github.io/OpenWings/">
<meta property="og:image" content="https://mrober01.github.io/OpenWings/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- all in-flight symbology is drawn on this canvas (src/ui/Hud.js) -->
  <canvas id="hud-canvas"></canvas>
  <div id="damage-vignette"></div>

  <!-- ===== Touch controls (phones / tablets) ===== -->
  <div id="touch-ui" class="hidden">
    <div id="look-zone"></div>
    <div id="stick-zone"></div>
    <div id="stick-base"><div id="stick-nub"></div></div>
    <div id="btns">
      <button class="tbtn sm" id="btn-view">VIEW</button>
      <button class="tbtn sm" id="btn-gear">GEAR</button>
      <button class="tbtn sm" id="btn-nav">NAV</button>
      <button class="tbtn sm" id="btn-auto">AUTO</button>
      <button class="tbtn sm" id="btn-wing">WING</button>
      <button class="tbtn sm" id="btn-hook">HOOK</button>
      <button class="tbtn sm" id="btn-mtr">MTR</button>
      <button class="tbtn sm" id="btn-latch">LATCH</button>
      <button class="tbtn sm eject" id="btn-eject">EJECT</button>
      <button class="tbtn" id="btn-flare">FLR</button>
      <button class="tbtn" id="btn-msl">MSL</button>
      <button class="tbtn" id="btn-tgt">TGT</button>
      <button class="tbtn gun" id="btn-fire">GUN</button>
      <button class="tbtn" id="btn-brake">BRK</button>
    </div>
    <div id="throttle-zone">
      <div id="throttle-track"><div id="ab-mark">AB</div><div id="throttle-knob"></div></div>
    </div>
  </div>
  <button id="btn-pause" class="hidden" aria-label="Pause">II</button>

  <!-- ===== Hangar ===== -->
  <div id="menu" class="screen">
    <div class="menu-inner">
      <header>
        <h1>OPEN<span>WINGS</span></h1>
        <p class="tagline">Nordic air combat · runs offline · phone &amp; desktop</p>
      </header>
      <section><h2>AIRCRAFT</h2><div class="cards" id="aircraft-cards"></div></section>
      <section><h2>MISSION</h2><div class="cards" id="mission-cards"></div></section>
      <section><h2>OPTIONS</h2><div class="opts" id="options"></div></section>
      <p class="menu-help" id="menu-help"></p>
    </div>
    <button id="btn-fly" class="big-btn">FLY ▶</button>
  </div>

  <!-- ===== Pause ===== -->
  <div id="pause" class="screen overlay hidden">
    <div class="dialog">
      <h1>PAUSED</h1>
      <div class="stats" id="pause-stats"></div>
      <button class="big-btn" id="btn-resume">RESUME</button>
      <button class="big-btn ghost" id="btn-restart">RESTART</button>
      <button class="big-btn ghost" id="btn-hangar">HANGAR</button>
    </div>
  </div>

  <!-- ===== Debrief ===== -->
  <div id="endscreen" class="screen overlay hidden">
    <div class="dialog">
      <h1 id="end-title">DEBRIEF</h1>
      <div class="stats" id="end-stats"></div>
      <button class="big-btn" id="btn-end-restart">FLY AGAIN</button>
      <button class="big-btn ghost" id="btn-end-hangar">HANGAR</button>
    </div>
  </div>

  <div id="rotate-hint"><div>⟳<p>Rotate your phone to landscape</p></div></div>
  <div id="loading" class="screen hidden"><div class="spinner"></div><p id="loading-msg">Building world…</p></div>
  <div id="toast"></div>
  <!-- autopilot mode picker (AUTO button / key O; 1-6 pick a mode while it is open) -->
  <div id="ap-panel" class="hidden">
    <div class="ap-title">AUTOPILOT</div>
    <button data-ap="takeoff"><i>1</i>TAKE OFF</button>
    <button data-ap="land"><i>2</i>LAND</button>
    <button data-ap="space"><i>3</i>GO TO SPACE</button>
    <button data-ap="landmark"><i>4</i>NEXT LANDMARK</button>
    <button data-ap="target"><i>5</i>ATTACK TARGET</button>
    <button data-ap="hold"><i>6</i>HOLD ALT / HDG</button>
    <button data-ap="off" class="off"><i>0</i>OFF</button>
  </div>

  <!-- wingman orders (WING button / key Y; 1-7 while it is open) -->
  <div id="wing-panel" class="hidden">
    <div class="ap-title">WINGMAN</div>
    <button data-wing="toggle"><i>1</i><span>CALL WINGMAN</span></button>
    <button data-wing="side"><i>2</i><span>SWAP SIDE</span></button>
    <button data-wing="wave"><i>3</i><span>CLOSE IN &amp; WAVE</span></button>
    <button data-wing="inverted"><i>4</i><span>INVERTED OVERHEAD</span></button>
    <button data-wing="barrel"><i>5</i><span>BARREL ROLL AROUND YOU</span></button>
    <button data-wing="roll"><i>6</i><span>VICTORY ROLL</span></button>
    <button data-wing="smoke"><i>7</i><span>SMOKE ON</span></button>
    <button data-wing="close" class="off"><i>0</i><span>CLOSE</span></button>
  </div>

  <script type="importmap">
  { "imports": { "three": "./assets/vendor/three.module.js" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
